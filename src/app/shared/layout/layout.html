<div class="casca" [class.casca-aberta]="menuAberto()">
  <aside class="barra">
    <a class="barra-marca" routerLink="/inicio" (click)="fecharMenu()">
      <span class="marca-simbolo">A</span>
      <span class="marca-nome">Agro</span>
    </a>

    <nav class="barra-menu">
      @for (item of menu(); track item.rota) {
        <a
          class="menu-item"
          [routerLink]="item.rota"
          routerLinkActive="menu-item-ativo"
          (click)="fecharMenu()"
        >
          <mat-icon>{{ item.icone }}</mat-icon>
          <span>{{ item.rotulo }}</span>
        </a>
      }
    </nav>

    @if (usuario(); as logado) {
      <div class="barra-rodape">
        <span class="ponto-ativo"></span>
        <span>{{ logado.papelNome }}</span>
      </div>
    }
  </aside>

  <!-- Só aparece com a gaveta aberta, no mobile: fechar clicando fora. -->
  <div class="veu" (click)="fecharMenu()"></div>

  <div class="coluna">
    <header class="cabecalho">
      <button
        matIconButton
        class="botao-gaveta"
        (click)="alternarMenu()"
        aria-label="Abrir ou fechar o menu"
      >
        <mat-icon>menu</mat-icon>
      </button>

      @if (superAdmin()) {
        <app-seletor-produtor />
      }

      <span class="cabecalho-espaco"></span>

      @if (usuario(); as logado) {
        <button class="conta" [matMenuTriggerFor]="menuConta" aria-label="Conta">
          <span class="conta-texto">
            <strong>{{ logado.email }}</strong>
            <small>{{ logado.papelNome }}</small>
          </span>
          <span class="conta-avatar">{{ iniciais() }}</span>
          <mat-icon class="conta-seta">expand_more</mat-icon>
        </button>

        <mat-menu #menuConta="matMenu">
          <button mat-menu-item (click)="sair()">
            <mat-icon>logout</mat-icon>
            <span>Sair do sistema</span>
          </button>
        </mat-menu>
      }
    </header>

    <main class="conteudo">
      <router-outlet />
    </main>
  </div>
</div>
