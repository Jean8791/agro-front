<div class="casca">
  <header class="topo">
    <a class="marca" routerLink="/inicio" (click)="fecharMenu()">
      <span class="marca-simbolo">A</span>
      <span class="marca-nome">Agro</span>
    </a>

    <nav class="abas" [class.abas-abertas]="menuAberto()" aria-label="Principal">
      @for (item of menu(); track item.rota) {
        <a
          class="aba"
          [routerLink]="item.rota"
          routerLinkActive="aba-ativa"
          (click)="fecharMenu()"
        >
          {{ item.rotulo }}
        </a>
      }
    </nav>

    <span class="topo-espaco"></span>

    @if (superAdmin()) {
      <app-seletor-produtor />
    }

    @if (usuario(); as logado) {
      <button class="conta" [matMenuTriggerFor]="menuConta" aria-label="Conta">
        <span class="conta-texto">
          <strong>{{ logado.email }}</strong>
          <small>{{ logado.papelNome }}</small>
        </span>
        <span class="conta-avatar">{{ iniciais() }}</span>
        <mat-icon class="conta-seta">expand_more</mat-icon>
      </button>

      <mat-menu #menuConta="matMenu">
        <button mat-menu-item (click)="sair()">
          <mat-icon>logout</mat-icon>
          <span>Sair do sistema</span>
        </button>
      </mat-menu>
    }

    <button
      matIconButton
      class="botao-menu"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAberto()"
      aria-label="Abrir ou fechar o menu"
    >
      <mat-icon>{{ menuAberto() ? 'close' : 'menu' }}</mat-icon>
    </button>
  </header>

  <p class="aviso-academico" role="note">
    <mat-icon>school</mat-icon>
    <span>
      <strong>Projeto acadêmico, para fins de estudo.</strong>
      Os dados são fictícios e os cálculos não substituem orientação técnica.
    </span>
  </p>

  <main class="conteudo">
    <router-outlet />
  </main>
</div>
